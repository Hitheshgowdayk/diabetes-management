{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>My Profile &amp; Reference Targets</h1>
  <form method="POST" class="grid-2" style="margin-top:16px;">
    <div>
      <label>Full Name</label><input type="text" name="full_name" value="{{ user.full_name }}" required />
      <label>Age</label><input type="number" name="age" value="{{ profile.age or '' }}" />
      <label>Gender</label><input type="text" name="gender" value="{{ profile.gender }}" />
      <label>Diabetes Category</label><input type="text" name="diabetes_type" value="{{ profile.diabetes_type }}" />
      <label>Emergency Contact Name</label><input type="text" name="emergency_contact_name" value="{{ profile.emergency_contact_name }}" />
      <label>Emergency Contact Phone</label><input type="text" name="emergency_contact_phone" value="{{ profile.emergency_contact_phone }}" />
    </div>
    <div>
      <label>Doctor Name</label><input type="text" name="doctor_name" value="{{ profile.doctor_name }}" />
      <label>Doctor Phone</label><input type="text" name="doctor_phone" value="{{ profile.doctor_phone }}" />
      <label>Fasting Min (mg/dL)</label><input type="number" step="0.1" name="fasting_min" value="{{ profile.fasting_min }}" required />
      <label>Fasting Max (mg/dL)</label><input type="number" step="0.1" name="fasting_max" value="{{ profile.fasting_max }}" required />
      <label>Post-Meal Max (mg/dL)</label><input type="number" step="0.1" name="post_meal_max" value="{{ profile.post_meal_max }}" required />
      <label>Low Threshold (mg/dL)</label><input type="number" step="0.1" name="low_threshold" value="{{ profile.low_threshold }}" required />
      <button class="btn btn-teal" type="submit">Save Profile &amp; Targets</button>
    </div>
  </form>
</div>
{% endblock %}
